services:
  - type: web
    name: zyon-bot
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: SESSION_DIR
        value: ./sessions
      # ====== CONFIGURACIÓN DE TU IA PERUANA ======
      - key: IA_API_URL
        value: https://tu-ia-peruana.com/api/chat   # <--- CAMBIAR POR TU URL REAL
      - key: IA_API_KEY
        value: tu_clave_secreta_aqui              # <--- CAMBIAR POR TU CLAVE REAL
